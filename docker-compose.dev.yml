services:
  data-api:
    image: ionoscope-data:dev
    restart: unless-stopped
    environment:
      IONOSCOPE_DATA_WORKSPACE: /app/live_data
    build:
      context: ../ionoscope-data
    ports:
      - "8001:8001"
    volumes:
      - ../ionoscope-data/live_data:/app/live_data
      - ../ionoscope-data/data:/app/data
      - ../ionoscope-data/cleaned:/app/cleaned
      - ../ionoscope-data/normalized:/app/normalized
      - ../ionoscope-data/features:/app/features
      - ../ionoscope-data/update_tasks:/app/update_tasks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  ml-service:
    image: ionoscope-ml-service:dev
    restart: unless-stopped
    build:
      context: ../ionoscope-ml-service
    ports:
      - "8002:8002"
    volumes:
      - ../ionoscope-ml-service/production_models:/app/production_models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    image: ionoscope-api:dev
    restart: unless-stopped
    build:
      context: ../ionoscope-api
    environment:
      IONOSCOPE_DATA_API_URL: http://data-api:8001
      IONOSCOPE_REQUIRE_ACTIVE_STATIONS: "true"
      IONOSCOPE_ML_SERVICE_URL: http://ml-service:8002
      IONOSCOPE_FORECAST_CACHE_DIR: /app/forecast_cache
    ports:
      - "8000:8000"
    volumes:
      - ../ionoscope-api/forecast_cache:/app/forecast_cache
    depends_on:
      data-api:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  data-update-worker:
    image: ionoscope-data:dev
    pull_policy: never
    restart: unless-stopped
    environment:
      IONOSCOPE_GIRO_RATE_DIR: /app/live_data/rate_limit
    command: ["python", "-u", "scripts/run_live_worker.py", "--candidate-registry", "/app/live_data/discovery/station_registry.json", "--stations", "${IONOSCOPE_LIVE_STATIONS:-auto}", "--sources", "${IONOSCOPE_LIVE_SOURCES:-giro,gfz,noaa}", "--interval-seconds", "${IONOSCOPE_LIVE_INTERVAL_SECONDS:-300}", "--retry-seconds", "${IONOSCOPE_LIVE_RETRY_SECONDS:-60}", "--initial-hours", "${IONOSCOPE_LIVE_INITIAL_HOURS:-24}", "--overlap-hours", "${IONOSCOPE_LIVE_OVERLAP_HOURS:-3}"]
    volumes:
      - ../ionoscope-data/live_data:/app/live_data
      - ../ionoscope-data/data:/app/data
      - ../ionoscope-data/cleaned:/app/cleaned
      - ../ionoscope-data/normalized:/app/normalized
      - ../ionoscope-data/features:/app/features
      - ../ionoscope-data/update_tasks:/app/update_tasks
    depends_on:
      data-api:
        condition: service_healthy
      api:
        condition: service_healthy

  station-discovery:
    image: ionoscope-data:dev
    pull_policy: never
    restart: unless-stopped
    depends_on:
      data-api:
        condition: service_healthy
    environment:
      IONOSCOPE_GIRO_RATE_DIR: /app/live_data/rate_limit
      IONOSCOPE_DATA_WORKSPACE: /app/live_data
    command: ["python", "-u", "scripts/run_station_discovery.py", "--interval-seconds", "${IONOSCOPE_DISCOVERY_INTERVAL_SECONDS:-3600}"]
    volumes:
      - ../ionoscope-data/live_data:/app/live_data
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from pathlib import Path; assert 'run_station_discovery.py' in Path('/proc/1/cmdline').read_text(); assert json.loads(Path('/app/live_data/discovery/status.json').read_text())['phase'] in ('running','ok','failed')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  forecast-refresh-worker:
    image: ionoscope-api:dev
    pull_policy: never
    restart: unless-stopped
    command:
      [
        "python",
        "scripts/run_forecast_refresh_worker.py",
        "--api-url",
        "http://api:8000",
        "--interval-seconds",
        "${IONOSCOPE_FORECAST_REFRESH_INTERVAL_SECONDS:-300}",
        "--timeout",
        "${IONOSCOPE_FORECAST_REFRESH_TIMEOUT_SECONDS:-30}",
        "--run-on-start"
      ]
    volumes:
      - ../ionoscope-api/forecast_cache:/app/forecast_cache
    depends_on:
      api:
        condition: service_healthy
