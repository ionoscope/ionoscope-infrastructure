name: Publish server review bundle
on:
  workflow_dispatch:
  push:
    tags: [review-v1]
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_ROOT: ghcr.io/ionoscope/ionoscope-infrastructure
      VERSION: review-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Check out pinned source revisions
        run: |
          set -euo pipefail
          git clone https://github.com/ionoscope/ionoscope-api.git api
          git -C api checkout cc5686d14f6d18343cfa08bb000019c7a310636e
          git clone https://github.com/ionoscope/ionoscope-data.git data
          git -C data checkout 0783ae63ab88471e713207ba909ab0ff145a80c6
          git clone https://github.com/ionoscope/ionoscope-ml-service.git ml
          git -C ml checkout 5e32ba74e30ce1e699efb169789ce9230934327e
          git clone https://github.com/ionoscope/ionoscope-frontend.git frontend
          git -C frontend checkout ac45bc78b007923b325091a56ac3b52e51d1191c
      - name: Build images
        run: |
          set -euo pipefail
          for service in api data ml; do
            docker build --label org.opencontainers.image.source=https://github.com/ionoscope/ionoscope-infrastructure -t "$IMAGE_ROOT/$service:$VERSION" "$service"
          done
          mkdir -p model-context/production_models model-context/candidate frontend-context
          curl -fL --retry 3 https://github.com/ionoscope/ionoscope-ml-service/releases/download/shadow-models-v1/original.joblib -o model-context/production_models/fof2_next_15min.joblib
          curl -fL --retry 3 https://github.com/ionoscope/ionoscope-ml-service/releases/download/shadow-models-v1/candidate.joblib -o model-context/candidate/model.joblib
          (cd model-context && sha256sum -c <<'EOF'
          c32e2157a7d066ff352c61db44ec48d33888b76fd270eb1520ef4cb708625b82  production_models/fof2_next_15min.joblib
          3f3008c698bee8b4b02a299cecda79441939c5db891db2b4f2c1183c24ee6350  candidate/model.joblib
          EOF
          )
          printf 'FROM %s/ml:%s\nCOPY production_models /app/production_models\nCOPY candidate /app/candidate\n' "$IMAGE_ROOT" "$VERSION" | docker build -t "$IMAGE_ROOT/ml:$VERSION" -f - model-context
          (cd frontend && npm ci && npm run build)
          cp -R frontend/dist frontend-context/dist
          cp nginx/frontend.conf frontend-context/default.conf
          printf 'FROM nginx:1.27-alpine\nCOPY dist/ /usr/share/nginx/html/\nCOPY default.conf /etc/nginx/conf.d/default.conf\n' | docker build -t "$IMAGE_ROOT/frontend:$VERSION" -f - frontend-context
          printf 'FROM nginx:1.27-alpine\nCOPY ionoscope.conf /etc/nginx/conf.d/default.conf\n' | docker build -t "$IMAGE_ROOT/gateway:$VERSION" -f - nginx
      - name: Verify clean deployment
        run: |
          set -euo pipefail
          trap 'docker compose -f compose.review.yml down -v' EXIT
          IONOSCOPE_HTTP_PORT=8080 docker compose -f compose.review.yml up -d --wait --wait-timeout 180 --pull never
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q '<app-root'
          docker compose -f compose.review.yml exec -T ml-service python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8002/api/v1/model-info'))['artifact_loaded']"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/forecast/refresh)" = 404
      - name: Publish downloadable server bundle
        run: |
          set -euo pipefail
          mkdir review
          cp compose.review.yml review/compose.yml
          cp docs/server-review.md review/README.md
          docker image save $(docker compose -f compose.review.yml config --images | sort -u) | gzip -1 > review/images.tar.gz
          tar -C review -czf ionoscope-review-linux-amd64.tar.gz compose.yml README.md images.tar.gz
          gh release create "$VERSION" ionoscope-review-linux-amd64.tar.gz --verify-tag --title "IonoScope server review" --notes-file docs/server-review.md
      - name: Push images to GitHub Container Registry
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in api data ml frontend gateway; do
            docker push "$IMAGE_ROOT/$service:$VERSION"
          done
